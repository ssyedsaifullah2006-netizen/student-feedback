<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <label>Course Name</label>
    <input type="text" placeholder="Enter course name">

    <label>Faculty Name</label>
    <input type="text" placeholder="Enter faculty name">

    <label>Student Name</label>
    <input type="text" placeholder="Enter student name">

    <label>Register Number</label>
    <input type="text" placeholder="Enter register number">

    <label>Department</label>
    <select>
        <option>Computer Science and Engineering</option>
        <option>Information Technology</option>
        <option>Software Engineering</option>
        <option>Electronics and Communication</option>
    </select>

    <label>Rating</label>
    <select>
        <option>5 - Excellent</option>
        <option>4 - Very Good</option>
        <option>3 - Good</option>
        <option>2 - Average</option>
        <option>1 - Poor</option>
    </select>

    <label>Feedback / Comments</label>
    <textarea rows="5" placeholder="Enter your feedback"></textarea>

    <button type="button">Submit Feedback</button>

</div>

</body>
</html>
