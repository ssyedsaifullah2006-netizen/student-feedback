apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-feedback
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-feedback
  template:
    metadata:
      labels:
        app: student-feedback
    spec:
      containers:
      - name: student-feedback
        image: syedsaifullah/student-feedback:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: student-feedback-service
spec:
  type: NodePort
  selector:
    app: student-feedback
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010